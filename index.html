<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Suelto M y G — Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #050e3a;
      --blue:    #0d1e6e;
      --blue2:   #1a2fa0;
      --yellow:  #ffd700;
      --yellow2: #ffb300;
      --red:     #e53935;
      --green:   #25d366;
      --white:   #ffffff;
      --muted:   rgba(255,255,255,0.65);
      --border:  rgba(255,215,0,0.25);
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--navy);
      color: var(--white);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(26,47,160,0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(26,47,160,0.4) 0%, transparent 60%);
    }

    /* ── ESTRELLAS ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1.5px 1.5px at 8% 15%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px   at 22% 40%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(2px 2px   at 35% 8%,  rgba(255,215,0,0.7)   0%, transparent 100%),
        radial-gradient(1px 1px   at 55% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 70% 5%,rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px   at 85% 35%, rgba(255,215,0,0.5)   0%, transparent 100%),
        radial-gradient(2px 2px   at 92% 18%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px   at 15% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 45% 85%,rgba(255,215,0,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px   at 75% 75%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(2px 2px   at 60% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px   at 30% 90%, rgba(255,255,255,0.6) 0%, transparent 100%);
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 28px 16px 20px;
      background: linear-gradient(180deg, rgba(13,30,110,0.9) 0%, transparent 100%);
      border-bottom: 2px solid var(--border);
    }

    .brand-title {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1;
      color: var(--white);
    }

    .brand-myg {
      font-style: italic;
      display: inline-block;
    }
    .letra-m {
      color: #e91e8c;
      text-shadow: 2px 3px 0 rgba(0,0,0,0.35), 0 0 20px rgba(233,30,140,0.3);
      -webkit-text-stroke: 1px rgba(0,0,0,0.15);
    }
    .letra-y {
      color: #ffffff;
      font-size: 0.7em;
      font-style: normal;
      vertical-align: middle;
      margin: 0 8px 0 8px;
      letter-spacing: -4px;
    }
    .letra-g {
      color: #2ecc40;
      text-shadow: 2px 3px 0 rgba(0,0,0,0.35), 0 0 20px rgba(46,204,64,0.3);
      -webkit-text-stroke: 1px rgba(0,0,0,0.15);
    }

    .brand-sub {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      color: var(--yellow);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .header-badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .badge {
      background: var(--yellow);
      color: var(--navy);
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
    }

    .badge.outline {
      background: transparent;
      border: 1.5px solid var(--yellow);
      color: var(--yellow);
    }

    .contact-bar {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .contact-bar a {
      color: var(--yellow);
      text-decoration: none;
      font-weight: 700;
    }

    /* ── FILTROS ── */
    .filters {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 24px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.5;
    }

    #buscar {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--white);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #buscar:focus { border-color: var(--yellow); }
    #buscar::placeholder { color: var(--muted); }

    .tipo-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tipo-btn {
      padding: 7px 18px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tipo-btn:hover,
    .tipo-btn.active {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--navy);
    }

    /* ── GRID DE PRODUCTOS ── */
    .products-section {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 24px auto 80px;
      padding: 0 16px;
    }

    .section-label {
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    #productos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* ── CARD ── */
    .card {
      background: linear-gradient(145deg, var(--blue) 0%, #0b1958 100%);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card-img-wrap {
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.3s;
    }

    .card:hover .card-img-wrap img { transform: scale(1.04); }

    .card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--yellow), var(--yellow2));
      border-radius: 12px 12px 0 0;
      z-index: 1;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(255,215,0,0.12);
    }

    .card.sin-stock {
      opacity: 0.55;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .tipo-tag {
      font-family: 'Oswald', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(255,215,0,0.15);
      color: var(--yellow);
      border: 1px solid rgba(255,215,0,0.4);
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .stock-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .stock-tag.ok   { background: rgba(37,211,102,0.15); color: #25d366; border: 1px solid rgba(37,211,102,0.4); }
    .stock-tag.bajo { background: rgba(255,183,0,0.15);  color: #ffb300; border: 1px solid rgba(255,183,0,0.4);  }
    .stock-tag.cero { background: rgba(229,57,53,0.15);  color: var(--red); border: 1px solid rgba(229,57,53,0.4); }

    .card-name {
      font-family: 'Oswald', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
      color: var(--white);
    }

    .card-brand {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .card-desc {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      font-style: italic;
    }

    .card-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2px 0;
    }

    .card-price {
      font-family: 'Oswald', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--yellow);
      letter-spacing: 1px;
    }

    .card-qty {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ── LOADING / EMPTY ── */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .state-msg .icon { font-size: 3rem; display: block; margin-bottom: 12px; }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--yellow);
      text-decoration: none;
    }

    /* ── WHATSAPP BTN ── */
    .wa-btn {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 100;
      width: 58px;
      height: 58px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(37,211,102,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
    }

    .wa-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 28px rgba(37,211,102,0.7);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      #productos-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .card { padding: 12px; }
      .card-price { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">TODO SUELTO <span class="brand-myg"><span class="letra-m">M</span><span class="letra-y">y</span><span class="letra-g">G</span></span></div>
    <div class="brand-sub">Productos de limpieza al por mayor y menor</div>
    <div class="header-badges">
      <span class="badge">⭐ Envíos a domicilio sin cargo</span>
      <span class="badge outline">Zona: Luzuriaga y alrededores</span>
    </div>
    <div class="contact-bar">
      Pedidos por WhatsApp: <a href="https://wa.me/541128864117">📱 11 2886-4117</a> · Daiana
    </div>
  </header>

  <div class="filters">
    <div class="search-wrap">
      <svg width="18" height="18" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="buscar" type="search" placeholder="Buscar producto o marca...">
    </div>
    <div class="tipo-btns">
      <button class="tipo-btn active" data-tipo="todos">Todos</button>
      <button class="tipo-btn" data-tipo="suelto">Suelto</button>
      <button class="tipo-btn" data-tipo="pack">Pack</button>
      <button class="tipo-btn" data-tipo="caja">Caja</button>
      <button class="tipo-btn" data-tipo="unidad">Unidad</button>
    </div>
  </div>

  <div class="products-section">
    <div class="section-label" id="contador">Cargando productos...</div>
    <div id="productos-grid">
      <div class="state-msg">
        <span class="icon">⏳</span>
        Cargando stock...
      </div>
    </div>
  </div>

  <footer>
    <p>Todo Suelto M y G · Pedidos: <a href="https://wa.me/541128864117">11 2886-4117</a> (Daiana)</p>
    <p style="margin-top:10px;"><a href="./admin/" style="font-size:0.72rem; color:rgba(255,255,255,0.25); text-decoration:none;">⚙ Admin</a></p>
  </footer>

  <a class="wa-btn" href="https://wa.me/541128864117" target="_blank" title="Escribinos por WhatsApp">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="white">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
  </a>

  <script>
    let todosLosProductos = [];
    let filtroTipo = 'todos';
    let filtroBuscar = '';

    async function cargarProductos() {
      try {
        const res = await fetch('./productos.json?v=' + Date.now());
        if (!res.ok) throw new Error('No se pudo cargar');
        todosLosProductos = await res.json();
        renderizar();
      } catch (e) {
        document.getElementById('productos-grid').innerHTML = `
          <div class="state-msg">
            <span class="icon">⚠️</span>
            No se pudo cargar el stock. Intentá de nuevo más tarde.
          </div>`;
        document.getElementById('contador').textContent = '';
      }
    }

    function formatPrecio(n) {
      return '$' + Number(n).toLocaleString('es-AR');
    }

    function stockTag(p) {
      if (!p.disponible || p.cantidad === 0) return '<span class="stock-tag cero">Sin stock</span>';
      if (p.cantidad <= 3)                   return '<span class="stock-tag bajo">Últimas unidades</span>';
      return '<span class="stock-tag ok">En stock</span>';
    }

    function tipoLabel(t) {
      const map = { suelto:'Suelto', pack:'Pack', caja:'Caja', unidad:'Unidad' };
      return map[t] || t;
    }

    function renderizar() {
      const busq = filtroBuscar.toLowerCase().trim();
      const filtrados = todosLosProductos.filter(p => {
        const coincideTipo = filtroTipo === 'todos' || p.tipo === filtroTipo;
        const coincideBusq = !busq ||
          p.nombre.toLowerCase().includes(busq) ||
          (p.marca || '').toLowerCase().includes(busq) ||
          (p.descripcion || '').toLowerCase().includes(busq);
        return coincideTipo && coincideBusq;
      });

      const total = filtrados.length;
      document.getElementById('contador').textContent =
        total === 0 ? '' :
        total === 1 ? '1 producto' : `${total} productos`;

      if (total === 0) {
        document.getElementById('productos-grid').innerHTML = `
          <div class="state-msg">
            <span class="icon">🔍</span>
            No hay productos que coincidan con tu búsqueda.
          </div>`;
        return;
      }

      document.getElementById('productos-grid').innerHTML = filtrados.map(p => {
        const sinStock = !p.disponible || p.cantidad === 0;
        const imgHtml = p.imagen
          ? `<div class="card-img-wrap"><img src="${p.imagen}" alt="${p.nombre}" loading="lazy"></div>`
          : '';
        return `
          <div class="card ${sinStock ? 'sin-stock' : ''}">
            ${imgHtml}
            <div class="card-body">
              <div class="card-top">
                <span class="tipo-tag">${tipoLabel(p.tipo)}</span>
                ${stockTag(p)}
              </div>
              <div class="card-name">${p.nombre}</div>
              ${p.marca       ? `<div class="card-brand">${p.marca}</div>` : ''}
              ${p.descripcion ? `<div class="card-desc">${p.descripcion}</div>` : ''}
              <hr class="card-divider">
              <div class="card-price">${formatPrecio(p.precio)}</div>
              <div class="card-qty">📦 ${p.cantidad} en stock</div>
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('buscar').addEventListener('input', e => {
      filtroBuscar = e.target.value;
      renderizar();
    });

    document.querySelectorAll('.tipo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtroTipo = btn.dataset.tipo;
        renderizar();
      });
    });

    cargarProductos();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
